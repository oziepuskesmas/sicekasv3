# ============================================================================
# SICEKAS v3.0 - CLOUDFLARE WORKERS & PAGES CONFIGURATION
# ============================================================================

name = "sicekasv2"
compatibility_date = "2026-08-01"
main = "functions/api/[[route]].ts"

[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "sicekas-v2"
database_id = "8186f6c9-f454-4a87-a541-50d09e74b929"

# Cloudflare R2 Object Storage Binding (Foto Kegiatan & Media)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sicekas-storage"

[vars]
APP_NAME = "SICEKAS v3.0"
ENVIRONMENT = "production"
PUSKESMAS_NAME = "Puskesmas Banjaran Kota"
